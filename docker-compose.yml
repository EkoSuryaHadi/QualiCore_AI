services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qualicore
      POSTGRES_USER: qualicore
      POSTGRES_PASSWORD: qualicore
    volumes:
      - qualicore_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qualicore"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://qualicore:qualicore@db:5432/qualicore
      JWT_SECRET: local-dev-secret-change-me
      CORS_ORIGINS: http://localhost:3000
      AUTO_BOOTSTRAP: "true"
      SEED_DEMO: "true"
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - qualicore_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  qualicore_pg:
  qualicore_uploads:
